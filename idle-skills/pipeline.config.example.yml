# pipeline.config.yml — the repository's settings for idle-skills.
# Copy this to pipeline.config.yml and edit. Skills read these values instead of
# hardcoding anything (they reference them as {{verify}}, {{vcs}}, ...).
# Taste and conventions do not live here: standing preferences are project memory
# in the record of work, repository conventions are AGENTS.md (see /setup).

# The single command that must pass before work goes into a PR.
# Tests for a library, `terraform plan` + policy for infra, E2E for an app —
# what "green" means is up to you, as long as one command produces it.
verify: "npm run verify"

# Who the product is for. It sets how rigorous the work is, never how big;
# over- and under-building both count as defects.
#   prototype  — builders/internal demo: core flow works manually; key features may be absent
#   mvp        — early tolerant users: core works mostly; auxiliary features and edge cases may be absent
#   production — ordinary users/customers: works normally and reliably; standard tests, errors, and security
#   critical   — enterprise/regulated/high-consequence customers: compliance, audit, rollback, and operational controls
engineering:
  tier: mvp

# Path + tokens of your design system, for /design. null → no design round
# (backend / infra / library repos).
designSystem: null
# designSystem:
#   path: "src/design-system"
#   tokens: "src/design-system/tokens.css"

# Version control + where /create-pr opens PRs and waits for CI. github | gitlab | none
vcs: github

# Mechanical checks run once before a reviewer or builder-retry spawn; the
# results are injected into the spawn brief so agents judge them instead of
# re-running them. Defaults to `verify` when absent — point it at a faster
# subset (lint + typecheck) when the full gate is too slow per spawn.
#
# TRUST: where the spawn hook is wired, this command is run by the hook
# itself whenever a builder or reviewer starts — a hook runs directly, so it is not covered by the host's tool-permission prompts. Point
# it only at commands this repository owns, and treat an edit to this line the
# way you would treat an edit to a CI workflow. Set PIPELINE_SKILL_INJECT=off
# to disable injection entirely.
# checks:
#   preSpawn: "npm run lint && npm run typecheck"
